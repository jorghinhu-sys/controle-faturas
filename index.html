<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#111a33">
<meta name="format-detection" content="telephone=no">
<title>Controle Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Direção: caderno de contas. Papel branco com pauta azul-clara, tinta azul para o que entra
   e para "no azul", tinta vermelha para "no vermelho", marca-texto amarelo para o que pede atenção.
   A capa azul-escura (barra e conta do mês) é o único bloco forte; o resto fica quieto. */
:root{
  --paper:#ffffff; --ink:#131c33; --ink2:#46536b; --ink3:#667389;
  --rule:#d7e2f2; --wash:#eef3fb;
  --blue:#2447c6; --blue-text:#2447c6; --blue-wash:#e4ebfb; --on-blue:#ffffff; --mute-mark:#b7c6ec;
  --red:#c9302c; --red-text:#b8281f; --red-wash:#fbe8e6;
  --warn:#b97800; --warn-wash:#fbefc9;
  --hl:#ffe36e; --hl-ink:#131c33;
  --cover:#111a33; --cover-ink:#ffffff; --cover-ink2:#b9c3da; --cover-rule:rgba(255,255,255,.32); --cover-wash:rgba(255,255,255,.1);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bar-h:52px; --tab-h:58px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1424; --ink:#e9eef8; --ink2:#b3bfd4; --ink3:#8793aa;
    --rule:#222d45; --wash:#18223a;
    --blue:#6f8ff0; --blue-text:#8fabff; --blue-wash:#1b2850; --on-blue:#0b1020; --mute-mark:#33446f;
    --red:#e8635a; --red-text:#ff8a80; --red-wash:#3a1d1f;
    --warn:#e0a11a; --warn-wash:#3a2f12;
    --hl:rgba(243,209,92,.2); --hl-ink:#f3d15c;
    --cover:#162048; --cover-ink2:#b6c1de;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1424; --ink:#e9eef8; --ink2:#b3bfd4; --ink3:#8793aa;
  --rule:#222d45; --wash:#18223a;
  --blue:#6f8ff0; --blue-text:#8fabff; --blue-wash:#1b2850; --on-blue:#0b1020; --mute-mark:#33446f;
  --red:#e8635a; --red-text:#ff8a80; --red-wash:#3a1d1f;
  --warn:#e0a11a; --warn-wash:#3a2f12;
  --hl:rgba(243,209,92,.2); --hl-ink:#f3d15c;
  --cover:#162048; --cover-ink2:#b6c1de;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font:16px/1.4 var(--ui);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hide{display:none!important}
.ic{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px;stroke-width:2.1}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- casca do app ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--cover);color:var(--cover-ink);padding-top:var(--st)}
.bar-in{height:var(--bar-h);max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 6px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:0 0 auto}
.ib:active{background:var(--cover-wash)}
.mnav{display:flex;align-items:center;min-width:0}
.mlabel{font:600 17px var(--num);padding:8px 4px;min-width:132px;text-align:center;white-space:nowrap}
.nowchip{font-size:12.5px;font-weight:600;border:1.5px solid var(--cover-rule);border-radius:999px;padding:4px 10px;margin-left:2px;white-space:nowrap}
.bar-title{font:600 18px var(--num);padding-left:10px}
.bar-r{display:flex;align-items:center}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:0;background:var(--cover);z-index:-1}
body.t-home::before{height:46vh}
.view{max-width:560px;margin:0 auto;padding:calc(var(--bar-h) + var(--st)) 0 calc(var(--tab-h) + var(--sb) + 28px);min-height:100vh}
.sheet{background:var(--paper);min-height:62vh}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:var(--sb)}
.tabs-in{max-width:560px;margin:0 auto;height:var(--tab-h);display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink3);font-weight:500}
.tab[aria-current="page"]{color:var(--blue-text);font-weight:700}
.tab .ic{width:24px;height:24px}
.plus{justify-self:center;align-self:start;width:56px;height:56px;margin-top:-16px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;box-shadow:0 0 0 5px var(--paper)}
.plus .ic{width:26px;height:26px;stroke-width:2.4}
.plus:active{transform:scale(.96)}

.page{position:relative;z-index:40;min-height:100vh;background:var(--paper)}
.pbar{position:sticky;top:0;z-index:5;background:var(--cover);color:var(--cover-ink);padding-top:var(--st)}
.pbar .bar-in{justify-content:flex-start}
.pbar h2{font:600 18px var(--num);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.pbody{max-width:560px;margin:0 auto;padding:18px 16px calc(48px + var(--sb));display:flex;flex-direction:column;gap:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--sb) + 22px);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;font-size:14.5px;z-index:60;max-width:calc(100% - 32px);width:max-content;text-align:center}

/* ---------- conta do mês (capa) ---------- */
.hero{background:var(--cover);color:var(--cover-ink);padding:2px 16px 22px}
.conta{display:flex;flex-direction:column}
.conta-row{display:grid;grid-template-columns:18px 1fr auto;align-items:baseline;width:100%;padding:7px 0;font-size:16px;color:var(--cover-ink2)}
.conta-row .sg{font:500 17px var(--num);color:var(--cover-ink2)}
.conta-row b{font:500 18px var(--num);font-variant-numeric:tabular-nums;color:var(--cover-ink)}
.conta-rule{border-top:2px solid var(--cover-rule);margin:7px 0 12px}
.conta-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:16px}
.conta-top .eq{display:grid;grid-template-columns:18px auto;align-items:baseline}
.tagp{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:#fff;white-space:nowrap}
.tagp.azul{color:#2447c6} .tagp.verm{color:#b8281f}
.fig{font:700 44px/1.05 var(--num);letter-spacing:-.02em;text-align:right;margin-top:6px;white-space:nowrap}
.fig.s{font-size:38px} .fig.xs{font-size:32px}
.hero-note{margin-top:12px;font-size:14px;color:var(--cover-ink2)}
.hero-btn{margin-top:14px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:#fff;color:#131c33;font-weight:600}
.hero h1{font:700 26px/1.2 var(--num);margin-top:8px}

/* ---------- blocos e listas ---------- */
.sec{padding:22px 16px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.sec-h h2{font:600 18px/1.25 var(--num)}
.sec-h .amt{font:600 16px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.link{color:var(--blue-text);font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center}
.note{font-size:14px;color:var(--ink3)}
.note.pad{padding:10px 0}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 16px 0}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:68px;justify-content:center;border:1.5px solid var(--rule);border-radius:14px;font-size:13px;font-weight:600;color:var(--ink2)}
.quick button .ic{color:var(--blue-text)}
.quick button:active{background:var(--wash)}
.rows{border-top:1px solid var(--rule)}
.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);min-height:62px}
.row-main{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;min-height:60px}
.row-main:active{background:var(--wash)}
.row-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.row-t{font-weight:500;overflow-wrap:anywhere}
.row-s{font-size:13px;color:var(--ink3);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.row-s .ic{vertical-align:-3px}
.row-v{font:600 16px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row-v.in{color:var(--blue-text)}
.tick{flex:0 0 auto;width:40px;height:48px;display:grid;place-items:center;margin-left:-6px}
.tick i{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink3);display:grid;place-items:center;color:var(--on-blue)}
.tick i .ic{width:16px;height:16px;stroke-width:2.8}
.tick[aria-pressed="true"] i{background:var(--blue);border-color:var(--blue)}
.av{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:var(--wash);color:var(--blue-text);display:grid;place-items:center}
.st{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.st.late{color:var(--red-text)}
.hl{background:var(--hl);color:var(--hl-ink);padding:1px 5px;border-radius:3px;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.empty{padding:26px 8px;text-align:center;color:var(--ink3);font-size:15px}
.empty .btn{margin-top:14px}
.day{font:600 13px var(--ui);color:var(--ink3);padding:16px 0 6px;display:flex;gap:8px;align-items:baseline}
.day b{font:700 16px var(--num);color:var(--ink)}

/* números em pares (tiles) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 16px 0}
.tile{border:1.5px solid var(--rule);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:13px;color:var(--ink3)}
.tile .v{font:600 19px var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.s{font-size:16px} .tile .v.xs{font-size:14px}
.tile .v.in{color:var(--blue-text)}
.tile .s{font-size:12.5px;color:var(--ink3)}
.meter{display:block;height:8px;border-radius:999px;background:var(--blue-wash);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.meter.warn{background:var(--warn-wash)} .meter.warn i{background:var(--warn)}
.meter.over{background:var(--red-wash)} .meter.over i{background:var(--red)}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--rule);font-size:15px}
.kv:first-child{border-top:1px solid var(--rule)}
.kv span{color:var(--ink2)}
.kv b{font:600 16px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.kv b.pos{color:var(--blue-text)} .kv b.neg{color:var(--red-text)}
button.kv{width:100%}

/* filtros */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chips.wrap .chip{flex:0 1 auto;max-width:100%;white-space:normal;text-align:left;padding:8px 14px}
.chip{flex:0 0 auto;border:1.5px solid var(--rule);border-radius:999px;padding:0 14px;font-size:14px;font-weight:500;min-height:38px;white-space:nowrap;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.mchip{flex:0 0 auto;border:1.5px solid var(--rule);border-radius:12px;padding:7px 12px;min-width:92px;text-align:left}
.mchip b{display:block;font:600 14px var(--num)}
.mchip span{display:block;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.mchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.mchip[aria-pressed="true"] span{color:var(--paper);opacity:.82}
.search{width:100%;border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:16px;min-height:44px;-webkit-appearance:none;appearance:none}
.search:focus{outline:none;border-color:var(--blue)}
.seg{display:flex;background:var(--wash);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--ink2);text-align:center;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--rule)}
.tools{display:flex;flex-direction:column;gap:10px;padding:16px 16px 0}

/* cartões */
.ctiles{display:flex;gap:12px;overflow-x:auto;padding:18px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.ctiles::-webkit-scrollbar{display:none}
.ctile{flex:0 0 auto;scroll-snap-align:center;width:236px;min-height:136px;border-radius:16px;background:var(--cover);color:var(--cover-ink);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;border:3px solid var(--cover)}
.ctile[aria-pressed="true"]{border-color:var(--blue)}
.ctile .cn{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-weight:600;font-size:15px;line-height:1.25}
.ctile .cn small{font:500 13px var(--num);color:var(--cover-ink2);white-space:nowrap;padding-top:1px}
.ctile .cl{font-size:12.5px;color:var(--cover-ink2)}
.ctile .cv{font:700 22px var(--num);white-space:nowrap}
.ctile .meter{height:6px;background:rgba(255,255,255,.2);margin-top:8px}
.ctile .meter i{background:#fff}
.ctile.add{background:none;color:var(--blue-text);border:1.5px dashed var(--mute-mark);width:128px;align-items:center;justify-content:center;font-weight:600;gap:6px}
.invfig{font:700 38px/1.1 var(--num);letter-spacing:-.02em;white-space:nowrap}
.invfig.s{font-size:32px} .invfig.xs{font-size:26px}
.invtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.pill{border:1.5px solid var(--rule);border-radius:999px;padding:0 14px;min-height:38px;font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{background:var(--blue-wash);border-color:var(--blue);color:var(--blue-text)}
.tagi{font:600 12px var(--num);background:var(--blue-wash);color:var(--blue-text);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.tagi.flat{background:var(--wash);color:var(--ink3);font-weight:500}

/* gráficos */
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart text{fill:var(--ink3);font:11px var(--ui)}
.chart text.v{fill:var(--ink);font:600 11.5px var(--num)}
.chart .b{fill:var(--mute-mark)} .chart .b.on{fill:var(--blue)}
.chart .pos{fill:var(--blue)} .chart .neg{fill:var(--red)}
.chart .dim{opacity:.45}
.chart .base{stroke:var(--ink3);stroke-width:1;opacity:.55}
.chart .ln{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--blue);opacity:.1}
.chart .dot{fill:var(--blue);stroke:var(--paper);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.chart g:focus-visible .hit{stroke:var(--blue);stroke-width:1.5}
.readout{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink2);min-height:22px}
.readout b{font:600 15px var(--num);color:var(--ink)}
.ranked{border-top:1px solid var(--rule)}
.rk{display:block;width:100%;padding:11px 0 12px;border-bottom:1px solid var(--rule)}
.rk:active{background:var(--wash)}
.rk-t{display:flex;align-items:center;gap:10px}
.rk-t .av{width:32px;height:32px;border-radius:9px}
.rk-t .av .ic{width:18px;height:18px}
.rk-t b{flex:1;min-width:0;font-weight:500}
.rk-t span{font:600 16px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.rk .meter{margin:8px 0 5px 42px}
.rk-s{font-size:13px;color:var(--ink3);margin-left:42px;display:block}
.tblw{overflow-x:auto;margin:0 -16px;padding:0 16px}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{padding:9px 0 9px 10px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl th{font-weight:500;color:var(--ink3);font-size:12.5px}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0;font-weight:600}
.tbl td.pos{color:var(--blue-text);font-weight:600} .tbl td.neg{color:var(--red-text);font-weight:600}
.tbl tr.on td{background:var(--wash)}

/* formulários */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.lab{font-size:14px;color:var(--ink2);font-weight:500}
.inp{border:1.5px solid var(--rule);background:var(--paper);border-radius:12px;padding:11px 14px;font-size:17px;min-height:50px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
.inp:focus{outline:none;border-color:var(--blue)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:36px}
textarea.inp{min-height:110px;font:12px/1.4 ui-monospace,Menlo,monospace}
input[type="date"].inp{display:block;text-align:left}
input[type="date"].inp::-webkit-date-and-time-value{text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.moneyf{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding:2px 0 6px}
.moneyf span{font:600 22px var(--num);color:var(--ink3)}
.moneyf input{border:0;background:none;font:700 40px/1.1 var(--num);width:100%;min-width:0;padding:0;outline:none;border-radius:0}
.moneyf input::placeholder{color:var(--mute-mark)}
.moneyf:focus-within{border-color:var(--blue)}
.mny{position:relative}
.mny .inp{padding-left:46px;font-family:var(--num);font-variant-numeric:tabular-nums}
.mny::before{content:"R$";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink3);font:500 16px var(--num);pointer-events:none}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 8px;border-radius:12px;border:1.5px solid transparent;font-size:12px;line-height:1.15;text-align:center;color:var(--ink2);min-height:74px}
.cat[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-wash);color:var(--ink);font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:50px;padding:6px 0;font-size:16px}
.sw i{flex:0 0 auto;width:50px;height:30px;border-radius:999px;background:var(--mute-mark);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"] i{background:var(--blue)}
.sw[aria-checked="true"] i::after{transform:translateX(20px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:13px;border:1.5px solid var(--rule);font-weight:600;font-size:16px;text-align:center}

<noscript>Este app precisa de JavaScript para funcionar.</noscript>
<script>
(function(){
'use strict';
/* ===== utilidades ===== */
var APP_VERSION = '4.0';
var MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var MESES_L = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
var nf = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
var nf0 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});

function $(id){ return document.getElementById(id); }
function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function r2(v){ return Math.round(v*100)/100; }
function ct(v){ return Math.round(v*100); }
function brl(n){ n = r2(n)||0; return (n<0?'−':'')+'R$ '+nf.format(Math.abs(n)); }
function plural(n,one,many){ return n+' '+(n===1?one:many); }

/* meses e datas: mês como 'AAAA-MM', dia como 'AAAA-MM-DD' */
function mi(k){ var p=k.split('-'); return (+p[0])*12+(+p[1])-1; }
function mk(i){ return Math.floor(i/12)+'-'+pad(i%12+1); }
function mlab(k){ var i=mi(k); return MESES[i%12]+'/'+String(Math.floor(i/12)).slice(2); }
function mname(k){ return MESES_L[mi(k)%12]; }
function mlong(k){ return mname(k)+' de '+k.slice(0,4); }
function todayIso(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function curK(){ return todayIso().slice(0,7); }
function daysIn(k){ var p=k.split('-'); return new Date(+p[0],+p[1],0).getDate(); }
function isoDate(k,day){ return k+'-'+pad(Math.min(Math.max(1,day),daysIn(k))); }
function toDate(iso){ var p=iso.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function dayDiff(a,b){ return Math.round((toDate(a)-toDate(b))/864e5); }
function dshort(iso){ var p=iso.split('-'); return p[2]+'/'+p[1]; }
function dfull(iso){ var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function wday(iso){ return DIAS[toDate(iso).getDay()]; }
function validK(s){ return typeof s==='string' && /^\d{4}-(0[1-9]|1[0-2])$/.test(s); }
function validIso(s){
  if(typeof s!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  var p=s.split('-'), d=toDate(s);
  return d.getFullYear()===+p[0] && d.getMonth()===+p[1]-1 && d.getDate()===+p[2];
}
function uid(p){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function cleanId(s){ return String(s==null?'':s).replace(/[^\w-]/g,'').slice(0,40); }
function plain(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase(); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* campo de dinheiro: digita só números e os centavos entram sozinhos (1299 vira 12,99) */
function fmtInput(v){ return v>0 ? nf.format(v) : ''; }
function maskMoney(el){
  var d=el.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,11);
  el.value = d ? nf.format((+d)/100) : '';
}
function moneyVal(el){ var d=el.value.replace(/\D/g,''); return d ? (+d)/100 : NaN; }
function bindMoney(el,cb){ el.addEventListener('input',function(){ maskMoney(el); if(cb) cb(); }); }

/* ===== categorias ===== */
var CATS = [
  {id:'mercado',n:'Mercado',s:'Mercado',i:'cart',k:'out'},
  {id:'alim',n:'Alimentação',s:'Alimentação',i:'food',k:'out'},
  {id:'transp',n:'Transporte',s:'Transporte',i:'car',k:'out'},
  {id:'casa',n:'Casa e contas',s:'Casa',i:'house',k:'out'},
  {id:'serv',n:'Assinaturas e serviços',s:'Assinaturas',i:'phone',k:'out'},
  {id:'saude',n:'Saúde',s:'Saúde',i:'health',k:'out'},
  {id:'beleza',n:'Beleza e cuidados',s:'Beleza',i:'spark',k:'out'},
  {id:'lazer',n:'Lazer',s:'Lazer',i:'play',k:'out'},
  {id:'compras',n:'Compras',s:'Compras',i:'bag',k:'out'},
  {id:'educ',n:'Educação',s:'Educação',i:'book',k:'out'},
  {id:'pix',n:'Pix e transferências',s:'Pix',i:'swap',k:'out'},
  {id:'fin',n:'Taxas e juros',s:'Taxas',i:'percent',k:'out'},
  {id:'reserva',n:'Reservas e objetivos',s:'Reservas',i:'target',k:'out'},
  {id:'outros',n:'Outros',s:'Outros',i:'dots',k:'out'},
  {id:'sal',n:'Salário',s:'Salário',i:'brief',k:'in'},
  {id:'extra',n:'Renda extra',s:'Renda extra',i:'zap',k:'in'},
  {id:'rend',n:'Rendimentos',s:'Rendimentos',i:'trend',k:'in'},
  {id:'reemb',n:'Reembolsos',s:'Reembolsos',i:'undo',k:'in'},
  {id:'outin',n:'Outras receitas',s:'Outras',i:'dots',k:'in'}
];
var BASE = {}; CATS.forEach(function(c){ BASE[c.id]=c; });
var FATURA = {id:'fatura',n:'Fatura do cartão',s:'Fatura',i:'card',k:'out'};

/* palpite de categoria pela descrição; a ordem importa (a primeira regra que casar vence) */
var RULES_OUT = [
  ['serv',/ANTHROPIC|CLAUDE|NETFLIX|SPOTIFY|DISNEY|\bHBO\b|YOUTUBE|GOOGLE|APPLE|ICLOUD|CLARO|\bVIVO\b|\bTIM\b|INTERNET|PRIME VIDEO|GLOBOPLAY|DEEZER|MICROSOFT|OPENAI|CHATGPT|CANVA|CELULAR|TELEFONE/],
  ['fin',/ANUIDADE|\bIOF\b|TARIFA|JUROS|ENCARGO|MULTA|SEGURO/],
  ['transp',/UBER|99\*|\b99\b|BUSER|PASSDEONIBUS|RECARGA TRANS|POSTO |COMBUST|GASOLINA|ETANOL|ESTACIONA|SEM ?PARAR|PEDAGIO|CABIFY|ONIBUS|METRO\b|PASSAGEM/],
  ['saude',/DROG|FARMA|RAIA|NISSEI|PAGUE MENOS|HOSPITAL|CLINIC|LABORAT|WELLHUB|GYMPASS|ACADEMIA|SMART ?FIT|ODONTO|DENTISTA|MEDIC|EXAME|UNIMED|PLANO DE SAUDE/],
  ['beleza',/BARBEARIA|BARBEIRO|BOTICARIO|SALAO|BELEZA|PERFUM|COSMET|NATURA|MANICURE|CABELEIREIR/],
  ['alim',/IFD\*|IFOOD|BURGER|HAMBURG|ACAI|PIZZ|RESTAUR|LANCH|\bBAR\b|CAFE|PADARIA|GOURMET|SORVET|PASTEL|RAPPI|MC ?DONALD|SUBWAY|CHURRAS|ESPETO|DOCERIA|CONFEITARIA|ALMOCO|JANTAR/],
  ['mercado',/SUPERMERC|MERCADO(?! ?LIVRE| ?PAGO)|ATACAD|ASSAI|CARREFOUR|SAMS CLUB|HORTIFRUTI|ACOUGUE|SACOLAO|PAO DE ACUCAR|MERCEARIA|EMPORIO|FEIRA/],
  ['casa',/ALUGUEL|CONDOMINIO|ENERGIA|CPFL|ENEL|SABESP|\bAGUA\b|\bLUZ\b|\bGAS\b|IPTU|LEROY|TELHANORTE|MOVEIS|FAXINA|DIARISTA/],
  ['educ',/ESCOLA|FACULDADE|CURSO|UDEMY|ALURA|LIVRARIA|MENSALIDADE|COLEGIO|UNIVERSIDADE|MATERIAL ESCOLAR/],
  ['lazer',/AIRBNB|CINEMA|INGRESSO|SYMPLA|HOTEL|BOOKING|DECATHLON|CENTAURO|PARQUE|STEAM|PLAYSTATION|XBOX|VIAGEM|\bCVC\b|LATAM|\bSHOW\b/],
  ['compras',/AMAZON|MERCADO ?LIVRE|SHOPEE|MAGALU|CASAS BAHIA|POLO WEAR|INDITEX|\bZARA\b|RENNER|RIACHUELO|FASHION|OUTLET|\bODP\b|\bTNG\b|LOJA|SHEIN|ALIEXPRESS|AMERICANAS/],
  ['reserva',/RESERVA|POUPANCA|INVESTIMENTO|TESOURO|\bCDB\b/],
  ['pix',/PICPAY|\bPIX\b|TRANSFER|MERCADO ?PAGO|PAGSEGURO|PAGBANK|RECARGAPAY|\bTED\b/]
];
var RULES_IN = [
  ['sal',/SALARIO|HOLERITE|ADIANTAMENTO|PAGAMENTO|DECIMO|\bVALE\b|FERIAS/],
  ['extra',/FREELA|EXTRA|BICO|VENDA|COMISSAO|BONUS/],
  ['rend',/RENDIMENTO|DIVIDENDO|JUROS|\bCDB\b|POUPANCA|ALUGUEL/],
  ['reemb',/REEMBOLSO|ESTORNO|DEVOLU|RESTITUI/]
];
function guessCat(d,k){
  var u=plain(d), rules=(k==='in')?RULES_IN:RULES_OUT;
  for(var i=0;i<rules.length;i++){ if(rules[i][1].test(u)) return rules[i][0]; }
  return k==='in'?'outin':'outros';
}
function catValid(id,k,custom){
  if(typeof id!=='string') return false;
  if(BASE[id]) return BASE[id].k===k;
  for(var i=0;i<custom.length;i++){ if(custom[i].id===id && custom[i].k===k) return true; }
  return false;
}
function catInfo(id,k){
  if(id==='fatura') return FATURA;
  if(BASE[id]) return BASE[id];
  for(var i=0;i<S.cats.length;i++){ if(S.cats[i].id===id) return {id:id,n:S.cats[i].n,s:S.cats[i].n,i:'tag',k:S.cats[i].k}; }
  return BASE[k==='in'?'outin':'outros'];
}
function catsOf(k){
  var base=CATS.filter(function(c){ return c.k===k; }), last=base.pop();
  var mine=S.cats.filter(function(c){ return c.k===k; }).map(function(c){ return {id:c.id,n:c.n,s:c.n,i:'tag',k:k}; });
  return base.concat(mine,[last]);
}

/* ===== estado =====
   cards:  [{id,name,last4,limit,adj,closing,due,goal}]
   items:  compras no cartão [{id,c,d,v,v1?,t,f,dt,cat}]  v = parcela, v1 = 1ª parcela quando difere, f = mês da 1ª fatura
   paid:   {'cartao:AAAA-MM': true}  faturas pagas
   tx:     lançamentos avulsos da carteira [{id,k:'in'|'out',d,v,dt,cat,done}]
   rec:    lançamentos que repetem [{id,k,d,v,day,cat,from,to|null,auto}]
   ov:     ajustes de um mês de um recorrente {'rec:AAAA-MM': {done,v,d,cat,day,skip}}
   bud:    orçamento por categoria {cat: valor}; budTot: teto do mês
   goals:  objetivos [{id,n,target,saved,due}]
   cats:   categorias criadas pelo usuário [{id,n,k}]
   open:   saldo de abertura (null = não acompanha saldo); saldo = open + tudo que já foi pago/recebido */
var LS_KEY = 'faturas_casasbahia_v1', LS_PRE = 'faturas_copia_antes_v6', VER = 6;
var S = null, storageOk = true;

function defSet(){ return {theme:'auto',hide:false,pay:'w',bk:'',snooze:'',news:false}; }
function fresh(){
  return {v:VER,start:curK(),paid:{},cards:[],items:[],tx:[],rec:[],ov:{},bud:{},budTot:0,goals:[],cats:[],open:null,set:defSet()};
}

/* Aceita qualquer versão antiga (v1 a v5) e devolve o estado no formato atual, sem perder lançamentos. */
function normalize(d){
  if(!d || typeof d!=='object' || !Array.isArray(d.items)) return null;
  var v0=+d.v||1, n=fresh(), seen={};
  function take(id,p){ var s=cleanId(id); if(!s || seen[s]) s=uid(p); seen[s]=1; return s; }
  function pos(x){ x=+x; return (isFinite(x) && x>0) ? r2(x) : 0; }
  n.start = validK(d.start) ? d.start : curK();

  if(Array.isArray(d.cats)) d.cats.forEach(function(c){
    if(!c || typeof c.n!=='string' || !c.n.trim()) return;
    var id=cleanId(c.id); if(!id || BASE[id] || id==='fatura' || seen[id]) id=uid('u'); seen[id]=1;
    n.cats.push({id:id,n:c.n.trim().slice(0,30),k:c.k==='in'?'in':'out'});
  });

  var legacy=!Array.isArray(d.cards), cardIds={}, cardMap={}, oldCg={};
  function addCard(c){
    var cl=Math.round(+c.closing), du=Math.round(+c.due), adj=+c.adj, id=take(c.id,'c');
    n.cards.push({id:id,name:String(c.name||'Cartão').slice(0,40),last4:String(c.last4||'').replace(/\D/g,'').slice(0,4),
      limit:pos(c.limit),adj:isFinite(adj)?r2(adj):0,closing:(cl>=1&&cl<=28)?cl:6,due:(du>=1&&du<=28)?du:20,goal:pos(c.goal)});
    cardIds[id]=1; cardMap[cleanId(c.id)]=id;
    if(c.cg && typeof c.cg==='object') Object.keys(c.cg).forEach(function(k){ var v=pos(c.cg[k]); if(v) oldCg[k]=r2((oldCg[k]||0)+v); });
    return id;
  }
  if(!legacy) d.cards.forEach(function(c){ if(c && typeof c.name==='string') addCard(c); });
  if(!n.cards.length && (legacy || d.items.length)) addCard({id:'c1',name:'Meu cartão',closing:d.closing,due:d.due});
  var firstCard=n.cards.length?n.cards[0].id:null;

  d.items.forEach(function(x){
    if(!x || typeof x.d!=='string' || typeof x.v!=='number' || !isFinite(x.v) || !firstCard) return;
    var t=Math.round(+x.t); if(!(t>=1&&t<=120)) return;
    if(!validK(x.f)) return;
    var c=cardMap[cleanId(x.c)], cat=catValid(x.cat,'out',n.cats)?x.cat:guessCat(x.d,'out');
    if(v0<6){ var g=guessCat(x.d,'out'); if(cat==='outros') cat=g; else if(cat==='serv' && g==='fin') cat='fin'; }
    var it={id:take(x.id,'i'),c:c||firstCard,d:x.d.slice(0,120),v:r2(x.v),t:t,f:x.f,dt:validIso(x.dt)?x.dt:(x.f+'-01'),cat:cat};
    var v1=pos(x.v1); if(v1 && t>1 && v1!==it.v) it.v1=v1;
    n.items.push(it);
  });

  if(d.paid && typeof d.paid==='object') Object.keys(d.paid).forEach(function(key){
    if(!d.paid[key]) return;
    var m=/^([\w-]+):(\d{4}-\d{2})$/.exec(key);
    if(/^\d{4}-\d{2}$/.test(key)){ if(firstCard) n.paid[firstCard+':'+key]=true; }
    else if(m && cardMap[m[1]]) n.paid[cardMap[m[1]]+':'+m[2]]=true;
  });

  if(Array.isArray(d.tx)) d.tx.forEach(function(x){
    if(!x || typeof x.d!=='string' || !pos(x.v) || !validIso(x.dt)) return;
    var k=x.k==='in'?'in':'out';
    n.tx.push({id:take(x.id,'t'),k:k,d:x.d.slice(0,120),v:pos(x.v),dt:x.dt,cat:catValid(x.cat,k,n.cats)?x.cat:guessCat(x.d,k),done:!!x.done});
  });

  var recIds={}, idMap={};
  if(Array.isArray(d.rec)) d.rec.forEach(function(x){
    if(!x || typeof x.d!=='string' || !pos(x.v) || !validK(x.from)) return;
    var k=x.k==='in'?'in':'out', day=Math.round(+x.day), id=take(x.id,'r');
    recIds[id]=1; idMap[cleanId(x.id)]=id;
    n.rec.push({id:id,k:k,d:x.d.slice(0,120),v:pos(x.v),day:(day>=1&&day<=31)?day:1,cat:catValid(x.cat,k,n.cats)?x.cat:guessCat(x.d,k),
      from:x.from,to:(validK(x.to)&&mi(x.to)>=mi(x.from))?x.to:null,auto:!!x.auto});
  });
  if(d.ov && typeof d.ov==='object') Object.keys(d.ov).forEach(function(key){
    var m=/^([\w-]+):(\d{4}-\d{2})$/.exec(key), o=d.ov[key];
    if(!m || !o || typeof o!=='object') return;
    var rid=idMap[m[1]]; if(!rid || !recIds[rid]) return;
    var c={}, dd=Math.round(+o.day);
    if(o.done===1||o.done===true) c.done=1; else if(o.done===0||o.done===false) c.done=0;
    if(pos(o.v)) c.v=pos(o.v);
    if(typeof o.d==='string' && o.d.trim()) c.d=o.d.slice(0,120);
    if(typeof o.cat==='string' && o.cat) c.cat=cleanId(o.cat);
    if(dd>=1&&dd<=31) c.day=dd;
    if(o.skip) c.skip=1;
    if(Object.keys(c).length) n.ov[rid+':'+m[2]]=c;
  });

  var bud=(d.bud && typeof d.bud==='object')?d.bud:oldCg;
  Object.keys(bud).forEach(function(k){ var v=pos(bud[k]); if(v && catValid(k,'out',n.cats)) n.bud[k]=v; });
  n.budTot=pos(d.budTot);

  if(Array.isArray(d.goals)) d.goals.forEach(function(g){
    if(!g || typeof g.n!=='string' || !g.n.trim() || !pos(g.target)) return;
    var sv=+g.saved; n.goals.push({id:take(g.id,'g'),n:g.n.trim().slice(0,40),target:pos(g.target),saved:(isFinite(sv)&&sv>0)?r2(sv):0,due:validK(g.due)?g.due:''});
  });

  n.open=(typeof d.open==='number' && isFinite(d.open))?r2(d.open):null;
  var st=(d.set && typeof d.set==='object')?d.set:{};
  n.set.theme=(st.theme==='light'||st.theme==='dark')?st.theme:'auto';
  n.set.hide=!!st.hide;
  n.set.pay=typeof st.pay==='string'?cleanId(st.pay)||'w':'w';
  n.set.bk=typeof st.bk==='string'?st.bk.slice(0,30):'';
  n.set.snooze=validIso(st.snooze)?st.snooze:'';
  n.set.news=!!st.news;
  return n;
}

function loadState(){
  var raw=null;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); raw=localStorage.getItem(LS_KEY); }catch(e){ storageOk=false; }
  if(raw){
    var d=null; try{ d=JSON.parse(raw); }catch(e){}
    var n=d?normalize(d):null;
    if(n){
      S=n;
      if((+d.v||1)<VER){
        /* guarda uma cópia do que havia antes de converter, para o caso de precisar voltar */
        try{ if(!localStorage.getItem(LS_PRE)) localStorage.setItem(LS_PRE,raw); }catch(e){}
        S.set.news=true;
        persist();
      }
      return;
    }
    try{ localStorage.setItem('faturas_ilegivel_'+Date.now(),raw); }catch(e){}
  }
  S=fresh();
}
function persist(){
  if(!storageOk) return false;
  try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); return true; }catch(e){ return false; }
}
function recordCount(){ return S.items.length+S.tx.length+S.rec.length; }

/* ===== cartões: faturas, parcelas e limite ===== */
function card(id){ for(var i=0;i<S.cards.length;i++){ if(S.cards[i].id===id) return S.cards[i]; } return null; }
function occ(it,k){ var n=mi(k)-mi(it.f)+1; return (n>=1&&n<=it.t)?n:0; }
function iv(it,n){ return (n===1 && it.v1!=null) ? it.v1 : it.v; }
function itTotal(it){ return r2((it.v1!=null?it.v1:it.v)+it.v*(it.t-1)); }
/* faturas só existem a partir do mês em que o cartão começou a ser acompanhado (S.start) */
function invRows(k,cid){
  var out=[]; if(mi(k)<mi(S.start)) return out;
  S.items.forEach(function(it){ if(it.c!==cid) return; var n=occ(it,k); if(n) out.push({it:it,n:n,v:iv(it,n)}); });
  return out;
}
function invTotal(k,cid){
  if(mi(k)<mi(S.start)) return 0;
  var s=0; S.items.forEach(function(it){ if(it.c!==cid) return; var n=occ(it,k); if(n) s+=ct(iv(it,n)); });
  return s/100;
}
/* mês da fatura (o do vencimento) em que cai uma compra feita na data dada.
   Compra feita no dia do fechamento já entra na fatura seguinte, como na maioria dos bancos. */
function invoiceFor(dateIso,cd){
  var p=dateIso.split('-').map(Number), i=p[0]*12+p[1]-1;
  if(p[2]>=cd.closing) i+=1;
  if(cd.due<=cd.closing) i+=1;
  return mk(Math.max(i,mi(S.start)));
}
function lastIdx(cid){
  var m=Math.max(mi(S.start),mi(curK()));
  S.items.forEach(function(it){ if(it.c!==cid) return; var e=mi(it.f)+it.t-1; if(e>m) m=e; });
  return m;
}
function months(cid){
  var a=[], last=lastIdx(cid);
  for(var i=Math.min(mi(S.start),mi(curK())); i<=last; i++) a.push(mk(i));
  return a;
}
function firstOpen(cid){
  var ms=months(cid);
  for(var i=0;i<ms.length;i++){ if(!S.paid[cid+':'+ms[i]] && invTotal(ms[i],cid)>0) return ms[i]; }
  return curK();
}
function usedNoAdj(cid){
  var t=0; months(cid).forEach(function(k){ if(!S.paid[cid+':'+k]) t+=ct(invTotal(k,cid)); });
  return t/100;
}
function limitInfo(cd){
  var u=r2(usedNoAdj(cd.id)+cd.adj);
  return {limit:cd.limit,used:u,avail:r2(cd.limit-u),pct:cd.limit>0?Math.min(100,Math.max(0,u/cd.limit*100)):0};
}
function meterState(pct,over){ return over?'over':(pct>=85?'warn':''); }

/* ===== carteira: receitas e despesas fora do cartão ===== */
function recById(id){ for(var i=0;i<S.rec.length;i++){ if(S.rec[i].id===id) return S.rec[i]; } return null; }
function txById(id){ for(var i=0;i<S.tx.length;i++){ if(S.tx[i].id===id) return S.tx[i]; } return null; }
function itemById(id){ for(var i=0;i<S.items.length;i++){ if(S.items[i].id===id) return S.items[i]; } return null; }
function recOcc(r,k){
  var i=mi(k); if(i<mi(r.from) || (r.to && i>mi(r.to))) return null;
  var o=S.ov[r.id+':'+k]||{}; if(o.skip) return null;
  var dt=isoDate(k,o.day||r.day);
  var done=o.done===1 ? true : (o.done===0 ? false : (!!r.auto && dt<=todayIso()));
  return {key:r.id+':'+k,rid:r.id,m:k,k:r.k,d:o.d||r.d,v:o.v!=null?o.v:r.v,cat:o.cat||r.cat,dt:dt,done:done,
    n:i-mi(r.from)+1,t:r.to?mi(r.to)-mi(r.from)+1:0};
}
function walletRows(k){
  var a=[];
  S.tx.forEach(function(x){ if(x.dt.slice(0,7)===k) a.push({key:x.id,id:x.id,k:x.k,d:x.d,v:x.v,cat:x.cat,dt:x.dt,done:x.done}); });
  S.rec.forEach(function(r){ var o=recOcc(r,k); if(o) a.push(o); });
  return a;
}
function invoiceRows(k){
  var a=[];
  S.cards.forEach(function(c){
    var t=invTotal(k,c.id);
    if(t>0) a.push({key:'inv:'+c.id+':'+k,inv:c.id,m:k,k:'out',d:'Fatura '+c.name,v:t,cat:'fatura',dt:isoDate(k,c.due),done:!!S.paid[c.id+':'+k]});
  });
  return a;
}
function byDate(a,b){ return a.dt<b.dt?-1:a.dt>b.dt?1:(a.k!==b.k?(a.k==='in'?-1:1):a.d.localeCompare(b.d)); }
function monthRows(k){ return walletRows(k).concat(invoiceRows(k)).sort(byDate); }
function monthSum(k){
  var s={inc:0,incD:0,exp:0,expD:0,inv:0,invD:0};
  walletRows(k).forEach(function(r){ var c=ct(r.v); if(r.k==='in'){ s.inc+=c; if(r.done) s.incD+=c; } else { s.exp+=c; if(r.done) s.expD+=c; } });
  invoiceRows(k).forEach(function(r){ var c=ct(r.v); s.inv+=c; if(r.done) s.invD+=c; });
  Object.keys(s).forEach(function(x){ s[x]/=100; });
  s.res=r2(s.inc-s.exp-s.inv); s.toPay=r2(s.exp-s.expD+s.inv-s.invD); s.toRecv=r2(s.inc-s.incD);
  return s;
}
function firstMonth(){
  var m=mi(curK());
  S.tx.forEach(function(x){ var i=mi(x.dt.slice(0,7)); if(i<m) m=i; });
  S.rec.forEach(function(r){ var i=mi(r.from); if(i<m) m=i; });
  if(S.items.length){ var s=mi(S.start); if(s<m) m=s; }
  return m;
}
/* o que ficou sem pagar ou receber em meses anteriores a k */
function pendingBefore(k){
  var out=[], a=Math.max(firstMonth(),mi(k)-36);
  for(var i=a;i<mi(k);i++){ monthRows(mk(i)).forEach(function(r){ if(!r.done) out.push(r); }); }
  return out;
}
function setDone(key,val){
  var p=key.split(':');
  if(p.length===3 && p[0]==='inv'){ var pk=p[1]+':'+p[2]; if(val) S.paid[pk]=true; else delete S.paid[pk]; return; }
  if(p.length===2){ var o=S.ov[key]||(S.ov[key]={}); o.done=val?1:0; return; }
  var x=txById(key); if(x) x.done=!!val;
}
function rowByKey(key){
  var p=key.split(':');
  if(p.length===3 && p[0]==='inv') return {key:key,inv:p[1],m:p[2]};
  if(p.length===2){ var r=recById(p[0]); return r?recOcc(r,p[1]):null; }
  var x=txById(key); return x?{key:x.id,id:x.id,k:x.k,d:x.d,v:x.v,cat:x.cat,dt:x.dt,done:x.done}:null;
}

/* saldo em conta = saldo de abertura + tudo que já foi marcado como recebido − pago − faturas pagas */
function netDone(){
  var s=0, cur=mi(curK());
  S.tx.forEach(function(x){ if(x.done) s+=(x.k==='in'?1:-1)*ct(x.v); });
  S.rec.forEach(function(r){
    var a=mi(r.from), b=Math.min(r.to?mi(r.to):cur+24,cur+24);
    for(var i=a;i<=b;i++){ var o=recOcc(r,mk(i)); if(o && o.done) s+=(o.k==='in'?1:-1)*ct(o.v); }
  });
  Object.keys(S.paid).forEach(function(key){ var m=/^([\w-]+):(\d{4}-\d{2})$/.exec(key); if(m && card(m[1])) s-=ct(invTotal(m[2],m[1])); });
  return s/100;
}
function balance(){ return S.open==null ? null : r2(S.open+netDone()); }
/* projeção a partir do mês atual: resultado planejado de cada mês (res) e acumulado (end).
   Com saldo em conta informado, o acumulado parte do saldo de hoje e soma só o que ainda falta acontecer
   (inclusive pendências de meses anteriores). Sem saldo, é a soma simples das sobras e faltas. */
function projection(n){
  var cur=mi(curK()), bal=balance(), acc=(bal==null?0:bal), out=[], lateIn=0, lateOut=0;
  if(bal!=null) pendingBefore(curK()).forEach(function(r){ if(r.k==='in') lateIn+=ct(r.v); else lateOut+=ct(r.v); });
  for(var j=0;j<n;j++){
    var k=mk(cur+j), s=monthSum(k);
    if(bal==null) acc=r2(acc+s.res);
    else acc=r2(acc+s.toRecv-s.toPay+(j===0?(lateIn-lateOut)/100:0));
    out.push({k:k,inc:s.inc,exp:s.exp,inv:s.inv,res:s.res,end:acc});
  }
  return out;
}

/* gastos por categoria no mês: despesas da carteira + o que cai nas faturas que vencem no mês */
function spendByCat(k){
  var o={};
  function add(cat,v){ var id=catInfo(cat,'out').id; o[id]=(o[id]||0)+ct(v); }
  walletRows(k).forEach(function(r){ if(r.k==='out') add(r.cat,r.v); });
  S.cards.forEach(function(c){ invRows(k,c.id).forEach(function(r){ add(r.it.cat,r.v); }); });
  Object.keys(o).forEach(function(id){ o[id]/=100; });
  return o;
}
function spendTotal(k){ var s=monthSum(k); return r2(s.exp+s.inv); }
function catEntries(k,cat){
  var a=[];
  walletRows(k).forEach(function(r){ if(r.k==='out' && catInfo(r.cat,'out').id===cat) a.push({d:r.d,v:r.v,dt:r.dt,src:'Carteira',key:r.key}); });
  S.cards.forEach(function(c){ invRows(k,c.id).forEach(function(r){
    if(catInfo(r.it.cat,'out').id===cat) a.push({d:r.it.d,v:r.v,dt:r.it.dt,src:c.name,item:r.it.id,n:r.n,t:r.it.t});
  }); });
  return a.sort(function(x,y){ return y.v-x.v; });
}
function invCats(k,cid){
  var o={}; invRows(k,cid).forEach(function(r){ var id=catInfo(r.it.cat,'out').id; o[id]=(o[id]||0)+ct(r.v); });
  Object.keys(o).forEach(function(id){ o[id]/=100; });
  return o;
}

/* lembrete de backup: os dados vivem só neste aparelho */
function needBackup(){
  if(recordCount()<5) return false;
  var t=todayIso();
  if(S.set.snooze && S.set.snooze>t) return false;
  if(!validIso(S.set.bk)) return true;
  return dayDiff(t,S.set.bk)>=15;
}

function compact(v){
  if(S.set.hide) return '•••';

/* aviso curto no rodapé */
var toastT=null;
function toast(msg){
  if(!msg) return;
  var t=$('toast'); t.textContent=msg; t.classList.remove('hide');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.add('hide'); },2800);
}
/* grava, redesenha e avisa */
function commit(msg){
  var ok=persist();
  render();
  if(stack.length && !stack[stack.length-1].form) refreshPage();
  toast(ok ? msg : (storageOk ? 'Não consegui salvar neste aparelho. Faça um backup em Ajustes.' : msg));
}

}
function openPage(p){
  if(!stack.length){ savedY=window.pageYOffset||0; shellHidden(true); }
  stack.push(p);
  try{ history.pushState({pg:stack.length},''); }catch(e){}
  showPage();
}
function doPop(){
  stack.pop();
  if(stack.length) showPage();
  else { $('page').innerHTML=''; shellHidden(false); window.scrollTo(0,savedY); }
}
function closePage(){
  if(!stack.length) return;
  var had=!!(history.state && history.state.pg);
  doPop();
  if(had){ skipPop++; try{ history.back(); }catch(e){ skipPop--; } }
}
function closeAllPages(){
  var n=stack.length; if(!n) return;
  var had=!!(history.state && history.state.pg);
  stack.length=1; doPop();
  if(had){ skipPop++; try{ history.go(-n); }catch(e){ skipPop--; } }
}
window.addEventListener('popstate',function(){
  if(skipPop>0){ skipPop--; return; }
  if(stack.length) doPop();
});

/* um único ouvinte de toque: cada botão diz o que faz em data-act */
document.addEventListener('click',function(e){

  var fn=ACT[el.getAttribute('data-act')]; if(fn) fn(el,e);

    var fn=ACT[e.target.getAttribute('data-act')]; if(fn){ e.preventDefault(); fn(e.target,e); }
  }
});
document.addEventListener('input',function(e){
  var k=e.target.getAttribute ? e.target.getAttribute('data-inp') : null;
  if(k && INP[k]) INP[k](e.target);
});

/* ===== gráficos (SVG) =====
   Colunas finas com ponta arredondada e base reta, uma cor por série, rótulo só no que importa;
   os valores completos estão sempre na lista ou tabela ao lado. */
function fx(n){ return (Math.round(n*10)/10).toString(); }
function colUp(x,y,w,h,r){
  r=Math.min(r,w/2,h);
  return 'M'+fx(x)+','+fx(y+h)+'V'+fx(y+r)+'Q'+fx(x)+','+fx(y)+' '+fx(x+r)+','+fx(y)+'H'+fx(x+w-r)+'Q'+fx(x+w)+','+fx(y)+' '+fx(x+w)+','+fx(y+r)+'V'+fx(y+h)+'Z';
}
function colDown(x,y,w,h,r){
  r=Math.min(r,w/2,h);
  return 'M'+fx(x)+','+fx(y)+'H'+fx(x+w)+'V'+fx(y+h-r)+'Q'+fx(x+w)+','+fx(y+h)+' '+fx(x+w-r)+','+fx(y+h)+'H'+fx(x+r)+'Q'+fx(x)+','+fx(y+h)+' '+fx(x)+','+fx(y+h-r)+'Z';
}
function monthTick(k,i,n){ return (n>14 && i%2) ? '' : MESES[mi(k)%12]; }
/* colunas por mês com um mês em destaque */
function chartMonths(ms,vals,sel,act,label){
  var n=ms.length, W=358, H=132, padX=2, top=10, base=H-20, mx=Math.max.apply(null,vals.concat([1]));
  var slot=(W-padX*2)/n, bw=Math.max(3,Math.min(24,slot-2)), s='<line class="base" x1="'+padX+'" x2="'+(W-padX)+'" y1="'+base+'" y2="'+base+'"/>';
  ms.forEach(function(k,i){
    var bh=vals[i]>0?Math.max(2,vals[i]/mx*(base-top)):0, x=padX+i*slot+(slot-bw)/2;
    s+='<g role="button" tabindex="0" data-act="'+act+'" data-m="'+k+'" aria-label="'+esc(mlab(k)+': '+money(vals[i]))+'">'+
      (bh?'<path class="b'+(k===sel?' on':'')+'" d="'+colUp(x,base-bh,bw,bh,4)+'"/>':'')+
      '<rect class="hit" x="'+fx(padX+i*slot)+'" y="0" width="'+fx(slot)+'" height="'+H+'"/>'+
      '<text x="'+fx(padX+i*slot+slot/2)+'" y="'+(H-6)+'" text-anchor="middle"'+(k===sel?' class="v"':'')+'>'+monthTick(k,i,n)+'</text></g>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="group" aria-label="'+esc(label)+'">'+s+'</svg>';
}
/* sobra (para cima, azul) ou falta (para baixo, vermelho) de cada mês */
function chartResult(P,sel){
  var n=P.length, W=358, H=170, padX=2, top=20, bottom=H-36;
  var vals=P.map(function(p){ return p.res; }), mx=Math.max.apply(null,vals.concat([0])), mn=Math.min.apply(null,vals.concat([0]));
  var range=(mx-mn)||1, zero=top+(mx/range)*(bottom-top), slot=(W-padX*2)/n, bw=Math.max(3,Math.min(24,slot-2)), s='';
  var iMax=vals.indexOf(mx), iMin=vals.indexOf(mn);
  P.forEach(function(p,i){
    var h=Math.abs(p.res)/range*(bottom-top), x=padX+i*slot+(slot-bw)/2, cx=padX+i*slot+slot/2, on=(p.k===sel);
    if(p.res!==0) h=Math.max(2,h);
    s+='<g role="button" tabindex="0" data-act="psel" data-m="'+p.k+'" aria-label="'+esc(mlab(p.k)+': '+(p.res<0?'falta ':'sobra ')+money(Math.abs(p.res)))+'">';
    if(p.res>0) s+='<path class="pos'+(sel&&!on?' dim':'')+'" d="'+colUp(x,zero-h,bw,h,4)+'"/>';
    if(p.res<0) s+='<path class="neg'+(sel&&!on?' dim':'')+'" d="'+colDown(x,zero,bw,h,4)+'"/>';
    if((i===iMax && mx>0) || (i===iMin && mn<0) || on){
      var ty=p.res>=0?(zero-h-5):(zero+h+13);
      s+='<text class="v" x="'+fx(Math.min(W-22,Math.max(22,cx)))+'" y="'+fx(ty)+'" text-anchor="middle">'+compact(p.res)+'</text>';
    }
    s+='<rect class="hit" x="'+fx(padX+i*slot)+'" y="0" width="'+fx(slot)+'" height="'+H+'"/>'+
      '<text x="'+fx(cx)+'" y="'+(H-6)+'" text-anchor="middle"'+(on?' class="v"':'')+'>'+monthTick(p.k,i,n)+'</text></g>';
  });
  s='<line class="base" x1="'+padX+'" x2="'+(W-padX)+'" y1="'+fx(zero)+'" y2="'+fx(zero)+'"/>'+s;
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="group" aria-label="Sobra ou falta de cada mês">'+s+'</svg>';
}
/* saldo acumulado ao fim de cada mês */
function chartBalance(P,sel){
  var n=P.length, W=358, H=150, padX=2, top=22, bottom=H-34;
  var vals=P.map(function(p){ return p.end; }), mx=Math.max.apply(null,vals.concat([0])), mn=Math.min.apply(null,vals.concat([0]));
  var range=(mx-mn)||1, slot=(W-padX*2)/n, zero=top+(mx/range)*(bottom-top);
  function X(i){ return padX+i*slot+slot/2; }
  function Y(v){ return top+((mx-v)/range)*(bottom-top); }
  var line='', s='';
  P.forEach(function(p,i){ line+=(i?'L':'M')+fx(X(i))+','+fx(Y(p.end)); });
  s+='<path class="ar" d="'+line+'L'+fx(X(n-1))+','+fx(zero)+'L'+fx(X(0))+','+fx(zero)+'Z"/>';
  s+='<line class="base" x1="'+padX+'" x2="'+(W-padX)+'" y1="'+fx(zero)+'" y2="'+fx(zero)+'"/>';
  s+='<path class="ln" d="'+line+'"/>';
  var iMin=vals.indexOf(Math.min.apply(null,vals)), iSel=-1;
  P.forEach(function(p,i){ if(p.k===sel) iSel=i; });
  var marks={}; marks[n-1]=1; marks[iMin]=1; if(iSel>-1) marks[iSel]=1;
  P.forEach(function(p,i){
    if(marks[i]){
      var y=Y(p.end), above=(y-9>12);
      s+='<circle class="dot" cx="'+fx(X(i))+'" cy="'+fx(y)+'" r="4"/>'+
        '<text class="v" x="'+fx(Math.min(W-26,Math.max(26,X(i))))+'" y="'+fx(above?y-9:y+18)+'" text-anchor="middle">'+compact(p.end)+'</text>';
    }
    s+='<g role="button" tabindex="0" data-act="psel" data-m="'+p.k+'" aria-label="'+esc(mlab(p.k)+': '+money(p.end))+'">'+
      '<rect class="hit" x="'+fx(padX+i*slot)+'" y="0" width="'+fx(slot)+'" height="'+H+'"/>'+
      '<text x="'+fx(X(i))+'" y="'+(H-6)+'" text-anchor="middle"'+(i===iSel?' class="v"':'')+'>'+monthTick(p.k,i,n)+'</text></g>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="group" aria-label="Saldo acumulado ao fim de cada mês">'+s+'</svg>';
}

/* ===== telas ===== */
function kv(label,value,cls){ return '<div class="kv"><span>'+label+'</span><b'+(cls?' class="'+cls+'"':'')+'>'+value+'</b></div>'; }
function chipBtn(act,val,cur,label){ return '<button type="button" class="chip" data-act="'+act+'" data-v="'+val+'" aria-pressed="'+(val===cur)+'">'+label+'</button>'; }
function segBtn(act,val,cur,label){ return '<button type="button" data-act="'+act+'" data-v="'+val+'" aria-pressed="'+(val===cur)+'">'+label+'</button>'; }

function dueLabel(r){
  if(r.done) return '';
  var dd=dayDiff(r.dt,todayIso());
  if(r.k==='in') return dd<0 ? '<span>esperada em '+dshort(r.dt)+'</span>' : '';
  if(dd<0) return '<span class="st late">'+ic('alert','sm')+'venceu há '+plural(-dd,'dia','dias')+'</span>';
  if(dd===0) return '<span class="hl">vence hoje</span>';
  if(dd===1) return '<span class="hl">vence amanhã</span>';
  if(dd<=5) return '<span class="hl">vence em '+dd+' dias</span>';
  return '';
}
/* linha de um lançamento da carteira ou de uma fatura: círculo marca pago/recebido, o resto abre */
function rowHtml(r,withDate){
  var sub='';
  if(withDate) sub+='<span>'+dshort(r.dt)+'</span>';
  sub+='<span>'+esc(r.inv?'Cartão de crédito':catInfo(r.cat,r.k).n)+'</span>';
  if(r.rid) sub+='<span>'+ic('repeat','sm')+' '+(r.t?(r.n+' de '+r.t):'todo mês')+'</span>';
  sub+=dueLabel(r);
  var lab=r.k==='in'?(r.done?'Recebido':'Marcar como recebido'):(r.done?'Pago':'Marcar como pago');
  return '<div class="row">'+
    '<button type="button" class="tick" data-act="tick" data-key="'+esc(r.key)+'" aria-pressed="'+r.done+'" aria-label="'+lab+': '+esc(r.d)+'"><i>'+(r.done?ic('check'):'')+'</i></button>'+
    '<button type="button" class="row-main" data-act="open" data-key="'+esc(r.key)+'">'+
      '<span class="row-l"><span class="row-t">'+esc(r.d)+'</span><span class="row-s">'+sub+'</span></span>'+
      '<span class="row-v'+(r.k==='in'?' in':'')+'">'+(r.k==='in'?'+ ':'')+money(r.v)+'</span></button></div>';
}
function sumRows(a){ var s=0; a.forEach(function(r){ s+=ct(r.v); }); return s/100; }

  if(ids.length){

/* ---------- Carteira ---------- */
function walletList(){
  var k=G.month, all=monthRows(k), rows=all, q=plain(G.wq.trim()), t=todayIso(), h='';
  if(G.wf==='pend') rows=rows.filter(function(r){ return !r.done; });
  if(G.wf==='in') rows=rows.filter(function(r){ return r.k==='in'; });
  if(G.wf==='out') rows=rows.filter(function(r){ return r.k==='out'; });
  if(q) rows=rows.filter(function(r){ return plain(r.d).indexOf(q)>-1; });
  if(!rows.length){
    if(all.length) return '<div class="empty">'+(G.wf==='pend'&&!q?'Nenhuma pendência em '+mname(k)+'.':'Nada encontrado com esse filtro.')+'</div>';
    return '<div class="empty">Nada lançado em '+mname(k)+'.<div class="btnrow">'+
      '<button type="button" class="btn sm" data-act="new" data-kind="out" data-pay="w">Lançar despesa</button>'+
      '<button type="button" class="btn sm" data-act="new" data-kind="in">Lançar receita</button></div></div>';
  }
  var last='';
  rows.forEach(function(r){
    if(r.dt!==last){
      if(last) h+='</div>';
      h+='<h3 class="day"><b>'+r.dt.slice(8)+'</b>'+wday(r.dt)+(r.dt===t?' <span class="hl">hoje</span>':'')+'</h3><div class="rows">';
      last=r.dt;
    }
    h+=rowHtml(r,false);
  });
  return h+'</div>';
}

function sepInfo(k,cd){
  if(S.paid[cd.id+':'+k]) return '';
  var tot=invTotal(k,cd.id); if(!(tot>0)) return '';
  var due=isoDate(k,cd.due), t=todayIso(), days=dayDiff(due,t);
  if(days>90) return '';
  if(days<0) return '<p class="hint"><span class="st late">'+ic('alert','sm')+'Venceu há '+plural(-days,'dia','dias')+'.</span> Pague '+money(tot)+' o quanto antes.</p>';
  if(days===0) return '<p class="hint"><span class="hl">Vence hoje.</span></p>';
  var weeks=Math.ceil(days/7), txt='Faltam '+plural(days,'dia','dias')+' para vencer. Para pagar tudo, separe ';
  txt+=(weeks<=1)?('<b>'+money(tot/days)+'</b> por dia'):('<b>'+money(tot/weeks)+'</b> por semana');
  txt+='.';
  /* a fatura do mês k fecha no dia de fechamento do mesmo mês, ou do mês anterior quando o vencimento vem antes */
  var closeK=(cd.due<=cd.closing)?mk(mi(k)-1):k, close=isoDate(closeK,cd.closing);
  if(t<close) txt+=' Ela fecha em '+dshort(close)+', então o valor ainda pode subir.';
  return '<p class="hint">'+txt+'</p>';
}

function statsSpend(){

  h+='<section class="sec"><p class="note">Gastos de '+mlong(k)+'</p><p class="invfig'+figCls(money(tot))+'">'+money(tot)+'</p>';

    var d=r2(tot-prev);
    h+='<p class="note" style="margin-top:4px">'+(d>0?money(d)+' a mais que em '+mname(prevK):(d<0?money(-d)+' a menos que em '+mname(prevK):'Igual a '+mname(prevK)))+'</p>';
  }
  if(S.budTot>0){
    var rest=r2(S.budTot-tot), bp=tot/S.budTot*100;
    h+='<div style="margin-top:12px">'+meter(bp,meterState(bp,rest<0))+'<p class="note" style="margin-top:6px">Teto do mês '+money(S.budTot)+': '+(rest>=0?'ainda cabem '+money(rest):'passou '+money(-rest))+'</p></div>';

  var ids=Object.keys(by);
  Object.keys(S.bud).forEach(function(id){ if(ids.indexOf(id)<0) ids.push(id); });

  else {
    var top=by[ids[0]]||1;
    h+='<div class="ranked">';

      var v=by[id]||0, b=S.bud[id]||0, pct, st='', sub;
      if(b>0){ pct=v/b*100; st=meterState(pct,v>b); sub='Orçamento '+money(b)+': '+(v>b?'passou '+money(v-b):'ainda cabem '+money(b-v)); }
      else { pct=v/top*100; sub=tot>0?Math.round(v/tot*100)+'% dos gastos':''; }
      h+='<button type="button" class="rk" data-act="catd" data-v="'+esc(id)+'"><span class="rk-t">'+avatar(id,'out')+'<b>'+esc(catInfo(id,'out').n)+'</b><span>'+money(v)+'</span></span>'+

function goalLine(g){

  if(g.due) return 'Faltam '+money(left)+'. O prazo era '+mlab(g.due);
  return 'Faltam '+money(left);
}

function openEntry(o){
  o=o||{};
  var today=todayIso(), F, src=null, rec=null;
  if(o.item){
    src=itemById(o.item); if(!src) return;
    F={mode:'item',kind:'out',pay:src.c,v:itTotal(src),d:src.d,cat:src.cat,dt:src.dt,t:src.t,f:src.f,fTouched:true,catTouched:true};
  } else if(o.key){
    var row=rowByKey(o.key); if(!row || row.inv) return;
    if(row.rid){
      rec=recById(row.rid);
      F={mode:'rec',kind:row.k,pay:'w',v:row.v,d:row.d,cat:row.cat,dt:row.dt,done:row.done,auto:rec.auto,scope:o.scope||'one',m:row.m,catTouched:true,doneTouched:true};
    } else {
      src=txById(row.id);
      F={mode:'tx',kind:src.k,pay:'w',v:src.v,d:src.d,cat:src.cat,dt:src.dt,done:src.done,catTouched:true,doneTouched:true};
    }
  } else {
    var kind=o.kind==='in'?'in':'out', pay='w';
    if(kind==='out'){
      if(o.pay==='card'){
        var c0=card(G.cid)||S.cards[0];
        if(!c0){ toast('Cadastre um cartão primeiro.'); openCardForm(null); return; }
        pay=c0.id;
      } else if(o.pay!=='w'){
        if(G.tab==='cards' && card(G.cid)) pay=G.cid; else if(card(S.set.pay)) pay=S.set.pay;
      }
    }
    var dt0=(G.tab!=='cards' && G.month!==curK()) ? isoDate(G.month,+today.slice(8)) : today;
    F={mode:'new',kind:kind,pay:pay,v:NaN,d:'',cat:kind==='in'?'sal':'outros',dt:dt0,rep:'no',nrep:2,done:dt0<=today,auto:false,t:1,f:null,scope:'one'};
  }
  var isNew=(F.mode==='new');
  function isCard(){ return F.kind==='out' && F.pay!=='w'; }
  function tval(){ return Math.round(+F.t)||0; }
  function nval(){ return Math.round(+F.nrep)||0; }
  function defCat(){ return F.kind==='in'?'sal':'outros'; }
  function autoF(){ var cd=card(F.pay); if(cd && !F.fTouched && validIso(F.dt)) F.f=invoiceFor(F.dt,cd); }
  autoF();

  var title=isNew?'Novo lançamento':(F.mode==='item'?'Compra no cartão':(F.kind==='in'?'Receita':'Despesa'));
  openPage({title:title,form:true,build:function(body){
    var h='';
    if(isNew) h+='<div class="seg" id="eKind" role="group" aria-label="Tipo de lançamento"><button type="button" data-k="out">Despesa</button><button type="button" data-k="in">Receita</button></div>';
    h+='<div class="f"><label for="eV" id="eVL">Valor</label><div class="moneyf"><span>R$</span><input id="eV" type="text" inputmode="numeric" autocomplete="off" placeholder="0,00" value="'+fmtInput(F.v)+'"></div></div>'+
      '<div class="f"><label for="eD">Descrição</label><input class="inp" id="eD" type="text" maxlength="120" autocomplete="off" placeholder="Ex.: mercado, aluguel, salário" value="'+esc(F.d)+'"></div>'+
      '<div class="f" id="ePayF"><span class="lab">Paguei com</span><div class="chips wrap" id="ePay"></div></div>'+
      '<div class="f"><span class="lab">Categoria</span><div class="catgrid" id="eCat"></div></div>'+
      '<div class="two" id="eRow"><div class="f"><label for="eDt" id="eDtL">Data</label><input class="inp" id="eDt" type="date" value="'+esc(F.dt)+'"></div>'+
      '<div class="f" id="eTF"><label for="eT">Parcelas</label><input class="inp" id="eT" type="number" inputmode="numeric" min="1" max="120" value="'+(F.t||1)+'"></div></div>'+
      '<div class="f" id="eFF"><label for="eF">1ª parcela na fatura de</label><select class="inp" id="eF"></select></div>'+
      '<div class="f" id="eRepF"><span class="lab">Repetir</span><div class="seg" id="eRep"><button type="button" data-r="no">Não repete</button><button type="button" data-r="mo">Todo mês</button><button type="button" data-r="n">Por uns meses</button></div></div>'+
      '<div class="f" id="eNF"><label for="eN">Por quantos meses</label><input class="inp" id="eN" type="number" inputmode="numeric" min="2" max="120" value="'+(F.nrep||2)+'"></div>'+
      '<div id="eSw">'+swHtml('eDone','<span id="eDoneL"></span>',F.done)+swHtml('eAuto','<span id="eAutoL"></span>',F.auto)+'</div>'+
      '<div class="f" id="eScopeF"><span class="lab">Aplicar</span><div class="seg" id="eScope"><button type="button" data-s="one">Só neste mês</button><button type="button" data-s="next">Deste mês em diante</button></div></div>'+
      '<p class="hint" id="eHint"></p><p class="err hide" id="eErr" role="alert"></p>'+
      '<button type="button" class="btn primary block" id="eSave">Salvar</button>';
    if(!isNew) h+='<button type="button" class="btn danger block" id="eDel">Excluir</button>';
    body.innerHTML=h;

    function press(box,at,val){ Array.prototype.forEach.call($(box).querySelectorAll('['+at+']'),function(b){ b.setAttribute('aria-pressed',String(b.getAttribute(at)===val)); }); }
    function catGrid(){
      $('eCat').innerHTML=catsOf(F.kind).map(function(c){
        return '<button type="button" class="cat" data-c="'+esc(c.id)+'" aria-pressed="'+(c.id===F.cat)+'"><span class="av">'+ic(c.i)+'</span>'+esc(c.s)+'</button>';
      }).join('');
    }
    function payChips(){
      var h2=isNew?'<button type="button" class="chip" data-p="w" aria-pressed="'+(F.pay==='w')+'">Conta ou dinheiro</button>':'';
      S.cards.forEach(function(c){ h2+='<button type="button" class="chip" data-p="'+esc(c.id)+'" aria-pressed="'+(F.pay===c.id)+'">'+esc(c.name)+(c.last4?' •• '+esc(c.last4):'')+'</button>'; });
      $('ePay').innerHTML=h2;
    }
    function fOptions(){
      var from=mi(S.start)-24, to=Math.max(mi(curK())+48,F.f?mi(F.f):0), h2='';
      if(F.f && mi(F.f)<from) from=mi(F.f);
      for(var i=from;i<=to;i++){ var k=mk(i); h2+='<option value="'+k+'"'+(k===F.f?' selected':'')+'>'+esc(mlong(k))+'</option>'; }
      $('eF').innerHTML=h2;
    }
    function hint(){
      var txt='', v=F.v;
      if(isCard()){
        var cd=card(F.pay), t=tval();
        if(v>0 && t>1){ var sp=split(v,t); txt+=(sp.v1!==sp.v?('1ª parcela de '+brl(sp.v1)+' e '+(t-1)+' de '+brl(sp.v)):(t+'x de '+brl(sp.v)))+'. '; }
        if(F.f && t>=1) txt+=(t>1?('Entra nas faturas de '+mlab(F.f)+' a '+mlab(mk(mi(F.f)+t-1))):('Entra na fatura de '+mlab(F.f)))+'. ';
        if(isNew && cd && cd.limit>0 && v>0){ var after=r2(limitInfo(cd).avail-v); txt+=after<0?('Passa do limite em '+brl(-after)+'.'):('Depois dela sobram '+brl(after)+' de limite.'); }
      } else if(isNew && F.rep!=='no' && validIso(F.dt)){
        var k0=F.dt.slice(0,7), n=nval();
        if(F.rep==='mo') txt='Repete todo dia '+(+F.dt.slice(8))+' a partir de '+mlab(k0)+', até você encerrar.';
        else if(n>=2) txt='De '+mlab(k0)+' a '+mlab(mk(mi(k0)+n-1))+(v>0?', total de '+brl(v*n):'')+'.';
      } else if(F.mode==='rec'){
        txt=rec.to?('Parcela '+(mi(F.m)-mi(rec.from)+1)+' de '+(mi(rec.to)-mi(rec.from)+1)+'.'):('Repete todo mês desde '+mlab(rec.from)+'.');
      }
      $('eHint').textContent=txt;
    }
    function sync(){
      var cardMode=isCard(), recMode=(F.mode==='rec'), repeats=recMode||(isNew && !cardMode && F.rep!=='no');
      if(isNew) press('eKind','data-k',F.kind);
      $('ePayF').classList.toggle('hide',!(F.kind==='out' && (isNew ? S.cards.length>0 : (F.mode==='item' && S.cards.length>1))));
      payChips(); catGrid();
      $('eVL').textContent=cardMode?(tval()>1?'Valor total da compra':'Valor da compra'):(repeats?'Valor por mês':'Valor');
      $('eDtL').textContent=cardMode?'Data da compra':(recMode?'Data neste mês':(repeats?'Primeira data':'Data'));
      $('eTF').classList.toggle('hide',!cardMode);
      $('eRow').style.gridTemplateColumns=cardMode?'':'1fr';
      $('eFF').classList.toggle('hide',!cardMode);
      if(cardMode) fOptions();
      $('eRepF').classList.toggle('hide',!(isNew && !cardMode));
      if(isNew) press('eRep','data-r',F.rep);
      $('eNF').classList.toggle('hide',!(isNew && !cardMode && F.rep==='n'));
      $('eDone').classList.toggle('hide',cardMode);
      $('eDone').setAttribute('aria-checked',String(!!F.done));
      $('eDoneL').textContent=(F.kind==='in'?'Já recebi':'Já paguei')+(repeats?' a de '+mname((recMode?F.m:(validIso(F.dt)?F.dt.slice(0,7):curK()))):'');
      $('eAuto').classList.toggle('hide',!repeats);
      $('eAuto').setAttribute('aria-checked',String(!!F.auto));
      $('eAutoL').textContent=(F.kind==='in'?'Marcar como recebida':'Marcar como paga')+' sozinha no dia, todo mês';
      $('eScopeF').classList.toggle('hide',!recMode);
      if(recMode){ press('eScope','data-s',F.scope); $('eDt').min=F.m+'-01'; $('eDt').max=isoDate(F.m,31); }
      hint();
    }
    sync();

    if(isNew) $('eKind').addEventListener('click',function(e){
      var b=e.target.closest('[data-k]'); if(!b || b.getAttribute('data-k')===F.kind) return;
      F.kind=b.getAttribute('data-k'); if(F.kind==='in') F.pay='w';
      F.catTouched=false; var g=guessCat(F.d,F.kind); F.cat=(g==='outros'||g==='outin')?defCat():g;
      sync();
    });
    $('ePay').addEventListener('click',function(e){
      var b=e.target.closest('[data-p]'); if(!b) return;
      F.pay=b.getAttribute('data-p'); if(isNew) F.fTouched=false; autoF(); sync();
    });
    $('eCat').addEventListener('click',function(e){
      var b=e.target.closest('[data-c]'); if(!b) return;
      F.cat=b.getAttribute('data-c'); F.catTouched=true; catGrid();
    });
    bindMoney($('eV'),function(){ F.v=moneyVal($('eV')); hint(); });
    $('eD').addEventListener('input',function(){
      F.d=$('eD').value;
      if(!F.catTouched){ var g=guessCat(F.d,F.kind), c=(g==='outros'||g==='outin')?defCat():g; if(c!==F.cat){ F.cat=c; catGrid(); } }
    });
    $('eDt').addEventListener('change',function(){
      F.dt=$('eDt').value;
      if(isNew && !F.doneTouched && validIso(F.dt)) F.done=(F.dt<=today);
      autoF(); sync();
    });
    $('eT').addEventListener('input',function(){ F.t=$('eT').value; $('eVL').textContent=tval()>1?'Valor total da compra':'Valor da compra'; hint(); });
    $('eF').addEventListener('change',function(){ F.f=$('eF').value; F.fTouched=true; hint(); });
    $('eRep').addEventListener('click',function(e){ var b=e.target.closest('[data-r]'); if(!b) return; F.rep=b.getAttribute('data-r'); sync(); });
    $('eN').addEventListener('input',function(){ F.nrep=$('eN').value; hint(); });
    $('eDone').addEventListener('click',function(){ F.done=!F.done; F.doneTouched=true; $('eDone').setAttribute('aria-checked',String(F.done)); });
    $('eAuto').addEventListener('click',function(){ F.auto=!F.auto; $('eAuto').setAttribute('aria-checked',String(F.auto)); });
    $('eScope').addEventListener('click',function(e){ var b=e.target.closest('[data-s]'); if(!b) return; F.scope=b.getAttribute('data-s'); press('eScope','data-s',F.scope); });

    $('eSave').addEventListener('click',function(){
      var v=F.v, d=$('eD').value.trim(), dt=$('eDt').value, err='', msg='', cd=null, t=0, pv=0, n=0;
      if(!(v>0)) err='Informe o valor.';
      else if(!validIso(dt)) err='Escolha a data.';
      else if(isCard()){
        cd=card(F.pay); t=tval(); pv=(t>=1)?split(v,t).v:0;
        if(!cd) err='Escolha o cartão.';
        else if(!(t>=1&&t<=120)) err='O número de parcelas deve ficar entre 1 e 120.';
        else if(!(pv>0)) err='O valor é baixo demais para '+t+' parcelas.';
      } else if(isNew && F.rep==='n'){ n=nval(); if(!(n>=2&&n<=120)) err='Informe de 2 a 120 meses.'; }
      if(err){ showErr('eErr',err); return; }
      if(!d) d=catInfo(F.cat,F.kind).n;
      v=r2(v);
      if(isCard()){
        if(!validK(F.f)) F.f=invoiceFor(dt,cd);
        var v1=split(v,t).v1, it=(F.mode==='item')?src:{id:uid('i')};
        it.c=cd.id; it.d=d; it.v=pv; it.t=t; it.f=F.f; it.dt=dt; it.cat=F.cat;
        if(t>1 && v1!==pv) it.v1=v1; else delete it.v1;
        if(F.mode!=='item'){ S.items.push(it); S.set.pay=cd.id; }
        G.cid=cd.id; G.inv=F.f;
        msg=(F.mode==='item')?'Compra atualizada.':'Compra lançada na fatura de '+mlab(F.f)+'.';
      } else if(isNew){
        var k0=dt.slice(0,7);
        if(F.rep==='no') S.tx.push({id:uid('t'),k:F.kind,d:d,v:v,dt:dt,cat:F.cat,done:!!F.done});
        else {
          var id=uid('r');
          S.rec.push({id:id,k:F.kind,d:d,v:v,day:+dt.slice(8),cat:F.cat,from:k0,to:F.rep==='n'?mk(mi(k0)+n-1):null,auto:!!F.auto});
          if(F.done) S.ov[id+':'+k0]={done:1}; else if(F.auto && dt<=today) S.ov[id+':'+k0]={done:0};
        }
        if(F.kind==='out') S.set.pay='w';
        msg=(F.kind==='in'?'Receita lançada':'Despesa lançada')+(k0!==G.month?' em '+mlab(k0):'')+'.';
      } else if(F.mode==='tx'){
        src.d=d; src.v=v; src.dt=dt; src.cat=F.cat; src.done=!!F.done; msg='Lançamento atualizado.';
      } else {
        var m=F.m, key=rec.id+':'+m, day=Math.min(+dt.slice(8),daysIn(m)), o;
        if(F.scope==='next'){
          var tg=rec;
          if(m!==rec.from){
            tg={id:uid('r'),k:rec.k,d:rec.d,v:rec.v,day:rec.day,cat:rec.cat,from:m,to:rec.to,auto:rec.auto};
            Object.keys(S.ov).forEach(function(kk){ var p=kk.split(':'); if(p[0]===rec.id && mi(p[1])>=mi(m)){ S.ov[tg.id+':'+p[1]]=S.ov[kk]; delete S.ov[kk]; } });
            rec.to=mk(mi(m)-1); S.rec.push(tg); key=tg.id+':'+m;
          }
          tg.d=d; tg.v=v; tg.day=day; tg.cat=F.cat; tg.auto=!!F.auto;
          o=S.ov[key]||{}; delete o.v; delete o.d; delete o.cat; delete o.day; o.done=F.done?1:0; S.ov[key]=o;
        } else {
          o=S.ov[key]||{};
          if(v!==rec.v) o.v=v; else delete o.v;
          if(d!==rec.d) o.d=d; else delete o.d;
          if(F.cat!==rec.cat) o.cat=F.cat; else delete o.cat;
          if(day!==Math.min(rec.day,daysIn(m))) o.day=day; else delete o.day;
          o.done=F.done?1:0; S.ov[key]=o; rec.auto=!!F.auto;
        }
        msg='Lançamento atualizado.';
      }
      closePage(); commit(msg);
    });

    if(!isNew) armed($('eDel'),function(){
      if(F.mode!=='rec') return 'Toque de novo para excluir';
      return F.scope==='next'?('Toque de novo: exclui de '+mname(F.m)+' em diante'):('Toque de novo: exclui só '+mname(F.m));
    },function(){
      if(F.mode==='tx') S.tx=S.tx.filter(function(x){ return x!==src; });
      else if(F.mode==='item') S.items=S.items.filter(function(x){ return x!==src; });
      else {
        var m=F.m, all=(F.scope==='next' && m===rec.from);
        if(F.scope==='next'){
          Object.keys(S.ov).forEach(function(kk){ var p=kk.split(':'); if(p[0]===rec.id && (all || mi(p[1])>=mi(m))) delete S.ov[kk]; });
          if(all) S.rec=S.rec.filter(function(x){ return x!==rec; }); else rec.to=mk(mi(m)-1);
        } else S.ov[rec.id+':'+m]={skip:1};
      }
      closePage(); commit('Lançamento excluído.');
    });
  }});
}

/* ---------- cartão ---------- */
function openCardForm(id){
  var cd=id?card(id):null, isNew=!cd;
  openPage({title:isNew?'Novo cartão':'Editar cartão',form:true,build:function(body){
    var h='<div class="f"><label for="cN">Nome do cartão</label><input class="inp" id="cN" type="text" maxlength="40" autocomplete="off" placeholder="Ex.: Nubank, Itaú Platinum" value="'+esc(cd?cd.name:'')+'"></div>'+
      '<div class="two"><div class="f"><label for="cL4">Final do cartão</label><input class="inp" id="cL4" type="text" inputmode="numeric" maxlength="4" placeholder="0000" value="'+esc(cd?cd.last4:'')+'"></div>'+
      mnyHtml('cLim','Limite total',cd?cd.limit:0)+'</div>'+
      '<div class="two"><div class="f"><label for="cCl">Dia do fechamento</label><input class="inp" id="cCl" type="number" min="1" max="28" inputmode="numeric" value="'+(cd?cd.closing:6)+'"></div>'+
      '<div class="f"><label for="cDu">Dia do vencimento</label><input class="inp" id="cDu" type="number" min="1" max="28" inputmode="numeric" value="'+(cd?cd.due:20)+'"></div></div>'+
      '<p class="hint">Compras feitas a partir do dia do fechamento entram na fatura seguinte.</p>'+
      mnyHtml('cBank','Disponível segundo o banco hoje (opcional)',0,'Em branco para não ajustar')+
      '<p class="hint">Se o disponível do app não bater com o do banco, digite aqui o valor do banco e o app guarda a diferença como ajuste.'+(cd&&cd.adj?' Ajuste atual: '+brl(cd.adj)+'.':'')+'</p>'+
      mnyHtml('cGoal','Meta para a fatura (opcional)',cd?cd.goal:0,'Sem meta')+
      '<p class="err hide" id="cErr" role="alert"></p>'+
      '<button type="button" class="btn primary block" id="cSave">Salvar</button>';
    if(!isNew) h+='<button type="button" class="btn danger block" id="cDel">Excluir cartão</button>';
    body.innerHTML=h;
    ['cLim','cBank','cGoal'].forEach(function(i){ bindMoney($(i)); });
    $('cSave').addEventListener('click',function(){
      var name=$('cN').value.trim(), l4=$('cL4').value.replace(/\D/g,'').slice(0,4), lim=moneyVal($('cLim')), cl=Math.round(+$('cCl').value), du=Math.round(+$('cDu').value), bank=moneyVal($('cBank')), goal=moneyVal($('cGoal')), err='';
      if(!name) err='Escreva o nome do cartão.';
      else if(!(cl>=1&&cl<=28) || !(du>=1&&du<=28)) err='Fechamento e vencimento devem ficar entre os dias 1 e 28.';
      else if(bank>=0 && !(lim>0)) err='Para usar o disponível do banco, informe também o limite total.';
      if(err){ showErr('cErr',err); return; }
      var tg=cd;
      if(isNew){
        if(!S.cards.length && !S.items.length) S.start=curK();
        tg={id:uid('c'),name:name,last4:l4,limit:0,adj:0,closing:cl,due:du,goal:0}; S.cards.push(tg);
      }
      tg.name=name.slice(0,40); tg.last4=l4; tg.limit=lim>0?r2(lim):0; tg.closing=cl; tg.due=du; tg.goal=goal>0?r2(goal):0;
      if(bank>=0 && tg.limit>0) tg.adj=r2(tg.limit-bank-usedNoAdj(tg.id));
      G.cid=tg.id; G.inv=null;
      closePage(); commit(isNew?'Cartão cadastrado.':'Cartão atualizado.');
    });
    if(!isNew) armed($('cDel'),'Toque de novo: apaga o cartão e as compras dele',function(){
      var gone=cd.id;
      S.cards=S.cards.filter(function(x){ return x.id!==gone; });
      S.items=S.items.filter(function(x){ return x.c!==gone; });
      Object.keys(S.paid).forEach(function(k){ if(k.indexOf(gone+':')===0) delete S.paid[k]; });
      if(S.set.pay===gone) S.set.pay='w';
      G.cid=null; G.inv=null;
      closePage(); commit('Cartão excluído.');
    });
  }});
}

/* ---------- objetivos ---------- */
function openGoal(id){
  var g=null, withTx=true;
  S.goals.forEach(function(x){ if(x.id===id) g=x; });
  openPage({title:g?'Objetivo':'Novo objetivo',form:true,build:function(body){
    var cur=mi(curK()), opts='<option value="">Sem prazo</option>', h='';
    if(g && g.due && mi(g.due)<cur) opts+='<option value="'+g.due+'" selected>'+esc(mlong(g.due))+'</option>';
    for(var i=cur;i<=cur+120;i++){ var k=mk(i); opts+='<option value="'+k+'"'+(g&&g.due===k?' selected':'')+'>'+esc(mlong(k))+'</option>'; }
    if(g){
      var left=r2(g.target-g.saved);
      h+='<div><p class="note">Guardado até agora</p><p class="invfig'+figCls(money(g.saved))+'">'+money(g.saved)+'</p><div style="margin:10px 0 6px">'+meter(g.target>0?g.saved/g.target*100:0)+'</div><p class="note">de '+money(g.target)+'. '+goalLine(g)+'</p></div>'+
        '<div class="grp"><h3>Guardar ou retirar</h3>'+mnyHtml('gAmt','Valor',0)+
        swHtml('gTx','Lançar como despesa na carteira',withTx)+
        '<div class="btnrow"><button type="button" class="btn primary" id="gAdd">Guardar</button><button type="button" class="btn" id="gSub">Retirar</button></div><p class="err hide" id="gErr2" role="alert"></p></div>'+
        '<div class="grp"><h3>Editar objetivo</h3>';
    }
    h+='<div class="f"><label for="gN">Nome</label><input class="inp" id="gN" type="text" maxlength="40" autocomplete="off" placeholder="Ex.: reserva de emergência" value="'+esc(g?g.n:'')+'"></div>'+
      mnyHtml('gT','Quanto quer juntar',g?g.target:0)+
      (g?'':mnyHtml('gS','Quanto já tem guardado (opcional)',0))+
      '<div class="f"><label for="gD">Até quando</label><select class="inp" id="gD">'+opts+'</select></div>'+
      '<p class="err hide" id="gErr" role="alert"></p><button type="button" class="btn primary block" id="gSave">'+(g?'Salvar alterações':'Criar objetivo')+'</button>';
    if(g) h+='<button type="button" class="btn danger block" id="gDel">Excluir objetivo</button></div>';
    body.innerHTML=h;
    bindMoney($('gT')); if($('gS')) bindMoney($('gS'));
    $('gSave').addEventListener('click',function(){
      var n=$('gN').value.trim(), t=moneyVal($('gT')), due=$('gD').value;
      if(!n){ showErr('gErr','Dê um nome ao objetivo.'); return; }
      if(!(t>0)){ showErr('gErr','Informe quanto quer juntar.'); return; }
      if(g){ g.n=n.slice(0,40); g.target=r2(t); g.due=validK(due)?due:''; }
      else { var sv=moneyVal($('gS')); S.goals.push({id:uid('g'),n:n.slice(0,40),target:r2(t),saved:sv>0?r2(sv):0,due:validK(due)?due:''}); }
      closePage(); commit(g?'Objetivo atualizado.':'Objetivo criado.');
    });
    if(g){
      bindMoney($('gAmt'));
      $('gTx').addEventListener('click',function(){ withTx=!withTx; $('gTx').setAttribute('aria-checked',String(withTx)); });
      var move=function(sign){
        var a=moneyVal($('gAmt'));
        if(!(a>0)){ showErr('gErr2','Informe o valor.'); return; }
        if(sign<0 && a>g.saved){ showErr('gErr2','Só há '+brl(g.saved)+' guardados.'); return; }
        g.saved=r2(g.saved+sign*a);
        if(withTx) S.tx.push({id:uid('t'),k:sign>0?'out':'in',d:(sign>0?'Reserva: ':'Retirada: ')+g.n,v:r2(a),dt:todayIso(),cat:sign>0?'reserva':'outin',done:true});
        closePage(); commit(sign>0?(brl(a)+' guardados em '+g.n+'.'):(brl(a)+' retirados de '+g.n+'.'));
      };
      $('gAdd').addEventListener('click',function(){ move(1); });
      $('gSub').addEventListener('click',function(){ move(-1); });
      armed($('gDel'),'Toque de novo para excluir',function(){ S.goals=S.goals.filter(function(x){ return x!==g; }); closePage(); commit('Objetivo excluído.'); });
    }
  }});
}

/* ---------- gastos de uma categoria no mês ---------- */
function pageCat(id){
  var c=catInfo(id,'out'), k=G.month;
  openPage({title:c.n,build:function(body){
    var a=catEntries(k,c.id), tot=0, b=S.bud[c.id]||0;
    a.forEach(function(e){ tot+=ct(e.v); }); tot/=100;
    var h='<div><p class="note">'+cap(mlong(k))+'</p><p class="invfig'+figCls(money(tot))+'">'+money(tot)+'</p>';
    if(b>0){ var p=tot/b*100; h+='<div style="margin:10px 0 6px">'+meter(p,meterState(p,tot>b))+'</div><p class="note">Orçamento '+money(b)+': '+(tot>b?'passou '+money(tot-b):'ainda cabem '+money(b-tot))+'</p>'; }
    h+='</div>';
    if(!a.length) h+='<div class="empty">Nenhum gasto nesta categoria em '+mname(k)+'.</div>';
    else {
      h+='<div class="rows">';
      a.forEach(function(e){
        h+='<div class="row"><button type="button" class="row-main" '+(e.item?'data-act="item" data-id="'+esc(e.item)+'"':'data-act="open" data-key="'+esc(e.key)+'"')+'>'+
          '<span class="row-l"><span class="row-t">'+esc(e.d)+'</span><span class="row-s"><span>'+dshort(e.dt)+'</span><span>'+esc(e.src)+'</span>'+(e.t>1?'<span class="tagi">'+e.n+'/'+e.t+'</span>':'')+'</span></span>'+
          '<span class="row-v">'+money(e.v)+'</span></button></div>';
      });
      h+='</div>';
    }
    body.innerHTML=h;
  }});
}

/* ---------- ajustes ---------- */
function setRow(p,icon,label,sub){

}
function pageSettings(){
  openPage({title:'Ajustes',build:function(body){
    var bal=balance(), nb=Object.keys(S.bud).length+(S.budTot>0?1:0), act=0, cur=mi(curK());
    S.rec.forEach(function(r){ if(!r.to || mi(r.to)>=cur) act++; });

      setRow('balance','bank','Saldo em conta',bal==null?'Não acompanhado':money(bal))+

      '<div class="grp"><h3>Sobre</h3><p class="hint">Versão '+esc(APP_VERSION)+'. Seus lançamentos ficam guardados só neste aparelho e nada é enviado para servidor. Por isso vale salvar um backup de tempos em tempos.</p>'+
      '<button type="button" class="btn sm" data-act="reload">Buscar atualização</button></div>';
  }});
}
function pageCards(){
  openPage({title:'Cartões',build:function(body){
    var h='';
    if(S.cards.length){
      h+='<div class="set">';
      S.cards.forEach(function(c){
        h+='<button type="button" class="set-row" data-act="cardEdit" data-id="'+esc(c.id)+'"><span class="av">'+ic('card')+'</span><span class="set-l"><b>'+esc(c.name)+'</b><small>Fecha dia '+c.closing+', vence dia '+c.due+(c.limit>0?', limite '+money(c.limit):'')+'</small></span>'+ic('right')+'</button>';
      });

    } else h+='<p class="hint">Nenhum cartão cadastrado.</p>';
    body.innerHTML=h+'<button type="button" class="btn primary block" data-act="cardNew">Novo cartão</button>';
